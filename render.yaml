# Render.com Deployment Configuration
# Hotel Employee Onboarding System

services:
  # Backend API Service
  - type: web
    name: hotel-onboarding-backend
    runtime: python
    region: oregon  # or ohio, virginia, frankfurt, singapore
    plan: starter  # $25/month - 1GB RAM, 0.5 CPU
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main_enhanced:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /api/healthz
    
    envVars:
      # Python Configuration
      - key: PYTHON_VERSION
        value: 3.12
      
      # Environment
      - key: ENVIRONMENT
        value: production
      
      # Database (auto-populated from database below)
      - key: DATABASE_URL
        fromDatabase:
          name: hotel-onboarding-db
          property: connectionString
      
      # Supabase (if keeping Supabase for storage)
      - key: SUPABASE_URL
        sync: false  # Set in Render dashboard
      - key: SUPABASE_KEY
        sync: false  # Set in Render dashboard
      
      # JWT Secret (auto-generated)
      - key: JWT_SECRET
        generateValue: true
      
      # Email Configuration
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USERNAME
        sync: false  # Set in Render dashboard
      - key: SMTP_PASSWORD
        sync: false  # Set in Render dashboard
      - key: SMTP_FROM_EMAIL
        sync: false  # Set in Render dashboard
      - key: SMTP_FROM_NAME
        value: Hotel Onboarding System
      
      # Frontend URL (update after frontend is deployed)
      - key: FRONTEND_URL
        value: https://hotel-onboarding-frontend.onrender.com
      
      # Groq API (optional, for OCR)
      - key: GROQ_API_KEY
        sync: false  # Set in Render dashboard if using
    
    # Auto-deploy on git push
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: hotel-onboarding-frontend
    runtime: static
    region: oregon
    plan: free  # Free tier for static sites
    branch: main
    rootDir: frontend/hotel-onboarding-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    
    # SPA routing - serve index.html for all routes
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    # Custom headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    
    envVars:
      # API URL (update after backend is deployed)
      - key: VITE_API_URL
        value: https://hotel-onboarding-backend.onrender.com/api
      
      # Supabase (if using)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    
    autoDeploy: true

# Database
databases:
  - name: hotel-onboarding-db
    databaseName: hotel_onboarding
    user: admin
    plan: starter  # $7/month - 1GB storage
    # Upgrade to standard ($20/month - 10GB) or pro ($90/month - 100GB) as needed
    region: oregon
    
    # Automatic backups included
    # Point-in-time recovery available on paid plans

